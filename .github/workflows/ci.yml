name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: End-to-end demo on the PCL table scene
        run: |
          pip install numpy
          python3 scripts/download_data.py
          ./build/caldera data/table_scene_lms400.ply | tee demo.log
          grep -q "TARGET FOUND" demo.log
